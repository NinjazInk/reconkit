[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reconkit"
version = "0.1.0"
description = "Subdomain enumeration and security header analysis for learning and authorized testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "dnspython>=2.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
reconkit = "reconkit.cli:main"

[tool.setuptools.packages.find]
include = ["reconkit*"]

[tool.setuptools.package-data]
"reconkit.data" = ["*.txt"]
